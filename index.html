<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Consultas</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#0052cc;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#003d99;
padding:10px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:10px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin:5px 0 15px;
}

button{
background:#0052cc;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#003d99;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,
table td{
border:1px solid #ddd;
padding:10px;
}

table th{
background:#0052cc;
color:white;
}

footer{
background:#003366;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}
</style>
</head>

<body>

<header id="inicio">
<h1>Central de Confirmação de Consultas</h1>
<p>Sede • Mundo Novo • Pedra Menina</p>
</header>

<nav>
<a href="#sede">Sede</a>
<a href="#mundo">Mundo Novo</a>
<a href="#pedra">Pedra Menina</a>
<a href="#registros">Registros</a>
</nav>

<div class="container">

<div class="card" id="sede">
<h2>Sede</h2>

<input type="text" id="nomeSede" placeholder="Nome do paciente">

<select id="statusSede">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvar('Sede','nomeSede','statusSede')">
Salvar
</button>
</div>

<div class="card" id="mundo">
<h2>Mundo Novo</h2>

<input type="text" id="nomeMundo" placeholder="Nome do paciente">

<select id="statusMundo">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvar('Mundo Novo','nomeMundo','statusMundo')">
Salvar
</button>
</div>

<div class="card" id="pedra">
<h2>Pedra Menina</h2>

<input type="text" id="nomePedra" placeholder="Nome do paciente">

<select id="statusPedra">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvar('Pedra Menina','nomePedra','statusPedra')">
Salvar
</button>
</div>

<div class="card" id="registros">

<h2>Registros</h2>

<button onclick="limpar()">
Limpar Todos
</button>

<table>

<thead>
<tr>
<th>Unidade</th>
<th>Paciente</th>
<th>Confirmou</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

</div>

</div>

<footer>
Central de Confirmação de Consultas
</footer>

<script>

let registros = JSON.parse(localStorage.getItem("consultas")) || [];

function salvar(unidade,nomeId,statusId){

let nome =
document.getElementById(nomeId).value;

let status =
document.getElementById(statusId).value;

if(nome === ""){
alert("Digite o nome.");
return;
}

registros.push({
unidade: unidade,
nome: nome,
status: status
});

localStorage.setItem(
"consultas",
JSON.stringify(registros)
);

document.getElementById(nomeId).value="";

mostrar();

}

function mostrar(){

let tabela =
document.getElementById("lista");

tabela.innerHTML="";

for(let i=0;i<registros.length;i++){

tabela.innerHTML +=
"<tr>" +
"<td>"+registros[i].unidade+"</td>" +
"<td>"+registros[i].nome+"</td>" +
"<td>"+registros[i].status+"</td>" +
"</tr>";

}

}

function limpar(){

localStorage.removeItem("consultas");

registros=[];

mostrar();

}

mostrar();

</script>

</body>
</html>
